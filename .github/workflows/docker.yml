name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    # For a self-hosted runner with Docker installed, use:
    # runs-on: [self-hosted, linux, docker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI env
        run: |
          cat >> .env.docker <<'EOF'
          DATABASE_URL=postgres://rokkru:rokkru@db:5432/rokkru
          DB_SSL=false
          JWT_SECRET=ci-jwt-secret
          JWT_REFRESH_SECRET=ci-jwt-refresh-secret
          EOF

      - name: Build and start stack
        run: docker compose --env-file .env.docker up -d --build

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose --env-file .env.docker logs backend
          exit 1

      - name: Seed user types
        run: |
          for name in Student Teacher Admin; do
            curl -sf -X POST "http://localhost:3000/api/v1/user-types" \
              -H "Content-Type: application/json" \
              -d "{\"user_type_name\":\"$name\"}" || true
          done

      - name: Smoke test backend health
        run: |
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000/health | grep -q '"status":"UP"'

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost/; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time"
          docker compose --env-file .env.docker logs frontend
          exit 1

      - name: Smoke test frontend
        run: curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost/ | grep -q 200

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.docker down -v
