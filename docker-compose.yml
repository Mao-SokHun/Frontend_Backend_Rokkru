# First time on a new machine ( .env.docker is not in git ):
#   cp .env.docker.example .env.docker
#
# Start (uses backend_rokkru/.env for DATABASE_URL, JWT, Stripe, etc.):
#   docker compose up --build
# Or explicitly:
#   docker compose --env-file .env.docker up --build
#
# Bundled Postgres instead of Neon (add --profile local-db):
#   docker compose --profile local-db up --build

services:
  db:
    profiles: [local-db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rokkru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rokkru}
      POSTGRES_DB: ${POSTGRES_DB:-rokkru}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rokkru} -d ${POSTGRES_DB:-rokkru}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend_rokkru
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - path: .env.docker
        required: false
      - path: backend_rokkru/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  db-seed:
    profiles: [local-db]
    image: curlimages/curl:8.5.0
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for name in Student Teacher Admin; do
          curl -sf -X POST "http://backend:3000/api/v1/user-types" \
            -H "Content-Type: application/json" \
            -d "{\"user_type_name\":\"$$name\"}" || true
        done
        echo "User types:"
        curl -sf "http://backend:3000/api/v1/user-types"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  backend_uploads:
